name: ci-pr
on: [pull_request, workflow_dispatch]
jobs:
  modules-ci:
    uses: ./.github/workflows/modules_ci.yml
    with:
      source: modules
      configure_args: -DMODULES_TEST=ON
  general-ci:
    uses: ./.github/workflows/general_ci.yml
    with:
      source: general
      install: extra-cmake-modules wayland-protocols
  format-check:
    uses: ./.github/workflows/format_check.yml
    with:
      script: scripts/format_code.sh
